name: Release

# Released on purpose, never as a side effect of pushing.
#
# Upstream ran semantic-release on every push to main, which reads commit prefixes and cuts a
# release whenever it sees a feat or a fix. That suits a project where every merge is a shipping
# decision. It does not suit this one: an installer that patches Discord goes out when someone has
# decided it should, and a surprise release racing a hand-made one is how two different builds end
# up wearing the same version number.
#
# The version is whatever gradle.properties says. It used to be typed into this form and written
# into app/build.gradle.kts by an action, which cannot work here: this project derives both the
# name and the code from the Gradle project version, so there were no literals for that action to
# overwrite and it would have published 1.3.0 again under a 1.3.1 tag.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        name: Build and publish the installer
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: gradle

            - name: Read the version, and refuse to reuse one
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version=$(sed -n 's/^version *= *//p' gradle.properties | tr -d ' \r')
                  test -n "$version"
                  if gh release view "v$version" >/dev/null 2>&1; then
                      echo "v$version is already released. Bump gradle.properties first." >&2
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "Releasing v$version"

            # The rule deciding whether a release is newer than what is installed. Getting it wrong
            # in one direction nags every user forever and offers them a downgrade; getting it wrong
            # in the other silently stops offering real updates, which nobody reports because
            # nothing appears to be broken.
            - name: Run the logic tests
              run: ./gradlew --no-daemon testDebugUnitTest

            # Signed with the same key every time. Android refuses an update signed by a different
            # one, so a release built without this would be uninstallable over the previous one.
            - name: Setup keystore
              run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore.jks

            - name: Build signed release
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
                  KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
              run: ./gradlew --no-daemon assembleRelease

            # The name is not cosmetic: esharq.org links straight at
            # releases/latest/download/esharq-mobile-manager.apk, so a build published under any
            # other name leaves the site's download button pointing at nothing.
            - name: Name it what the site links to
              run: |
                  mkdir -p dist
                  cp app/build/outputs/apk/release/*.apk dist/esharq-mobile-manager.apk
                  ls -l dist

            # A release signed by a different key than the one already installed cannot be
            # installed over it: Android rejects the update, and every existing user is stranded on
            # the old version with no way forward but uninstalling and losing their sign-in. That
            # is not something to discover from a user's report, so it is checked here — against
            # the APK actually published last time, not against an assumption about the secret.
            - name: Refuse to publish a build signed by a different key
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  previous=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
                  if [ -z "$previous" ]; then
                      echo "No previous release to compare against; nothing to break."
                      exit 0
                  fi

                  gh release download "$previous" -p esharq-mobile-manager.apk -O previous.apk
                  apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
                  test -x "$apksigner"

                  # apksigner's own output is kept, not just the parsed line. When this step first
                  # ran strictly it refused the release because both fingerprints came out empty,
                  # and the log said nothing about why — the tool's answer had been thrown away by
                  # the pipe. A check that can fail has to be able to explain itself.
                  fingerprint() {
                      local out="$2"
                      if ! "$apksigner" verify --print-certs "$1" > "$out" 2>&1; then
                          echo "apksigner could not read $1:" >&2
                          cat "$out" >&2
                          return 1
                      fi
                      # apksigner labels the signer "Signer #1" in some versions and
                      # "Signer (minSdkVersion=..., maxSdkVersion=...)" in others, so the label is
                      # matched loosely and every certificate found is compared, not just the first.
                      # "Source Stamp Signer" is Google Play's stamp, not ours, and does not match.
                      sed -n 's/^Signer[^:]* certificate SHA-256 digest: //p' "$out" | sort -u | paste -sd,
                  }

                  before=$(fingerprint previous.apk previous.txt)
                  after=$(fingerprint dist/esharq-mobile-manager.apk new.txt)
                  echo "$previous: $before"
                  echo "new:       $after"

                  # Two empty strings compare equal. The first version of this check read no
                  # certificate at all and announced that the keys matched — a guard that passes
                  # when it cannot see is worse than no guard, because it is believed.
                  if [ -z "$before" ] || [ -z "$after" ]; then
                      echo "Read no certificate from one of the APKs, so nothing was compared." >&2
                      echo "--- apksigner on $previous ---" >&2; cat previous.txt >&2
                      echo "--- apksigner on the new build ---" >&2; cat new.txt >&2
                      exit 1
                  fi

                  if [ "$before" != "$after" ]; then
                      echo "The signing key changed since $previous. Publishing this would lock" >&2
                      echo "every existing install out of updating. Fix the KEYSTORE secret." >&2
                      exit 1
                  fi
                  echo "Same key as $previous — updates will install."

            - name: Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  gh release create "v$VERSION" dist/esharq-mobile-manager.apk \
                      --title "إشراق للجوال $VERSION" \
                      --generate-notes
